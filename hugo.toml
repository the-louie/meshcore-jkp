baseURL = "https://meshcore-jkp.se/"
title = "MeshCore Jönköping"
locale = "sv"
defaultContentLanguage = "sv"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/sweden-mesh/meshcore-regional-template"

[params.region]
  scb = "06"                 # the template takes the county name and region (se-jkp) from zombiefredrik/meshcore-se-regioner
  short = "Jönköping"
  iatas = ["JKG"]
  center = [57.78, 14.16]
  zoom = 9

[params.naming]
  pattern = "SE-JKP-Plats"
  example = "SE-JKP-Braneryd"
  companion_example = "🥵Kapten CRISP🥵"
  place = "Taberg"
  place_accented = "Bråneryd"
  place_ascii = "Braneryd"
  explain = "SE för Sverige, JKP för länet (som regionen `se-jkp`) och en välkänd plats som de flesta i trakten känner igen. Står flera repeatrar på samma plats lägger du till de fyra första tecknen i nodens publika nyckel (som -FD70), så att namnen inte krockar."

# Places where the region wants a new repeater (operator 2026-11-15): listed on Bli nodvärd, circles on the map.
[[params.wanted]]
  name = "Sjogarp"
  lat = 57.90209
  lon = 14.10796
  note = "Vi har ingen bra koppling till Bankeryd nu, Sjogarp skulle kunna bli en länk mellan Jönköping och Bankeryd"

[[params.wanted]]
  name = "Sibbabo"
  lat = 57.87395
  lon = 13.93088
  note = "För att nå till Mullsjö behöver vi minst ett till hopp, Sibbabo är platsen närmast Mullsjö där man fortfarande har möjlighet att få in Jönköping."

[[params.wanted]]
  name = "Gränna"
  lat = 58.02025
  lon = 14.46263
  note = "Under gynnsamma förhållanden kan vi nå Hjo och Ödeshög, men för att få en stabil länk behöver vi minst en repeater på vägen."

[[params.wanted]]
  name = "Visingsö"
  lat = 58.03338
  lon = 14.3239
  note = "Hjälp oss att dra nytta av Vättern för att kunna länka ihop Västergötland, Östergötland, Närke och Jönköping."

[params.analytics]
  plausible = true
  script = "/p/s.js"
  api = "/p/event"

[params.beacon]
  url = "https://beacon.meshcore-jkp.se"
  # Our Beacon started 2026-11-12 and knows only nodes that have advertised since; meshat's
  # fills in the rest of the county until ours has heard them.
  seeds = ["https://beacon.meshat.se"]

# MeshMapper: the county's coverage map (jkpg.meshmapper.net is gone, 410), and its measured
# coverage as a map layer (permission given 2026-11-15; the key is the MESHMAPPER_API_KEY secret).
[params.meshmapper]
  url = "https://jkg.meshmapper.net/"
  coverage = true

[params.community]
  name = "JKPG-Mesh webb"
  url = "https://jkpg-mesh.se/"

[[params.chats]]
  name = "JKPG-Mesh Discord"
  url = "https://discord.gg/9FmWyw8UG7"

[[params.chats]]
  name = "Sweden Mesh Discord"
  url = "https://discord.gg/gchSzHkPGG"

[[params.links]]
  name = "meshat.se"
  url = "https://meshat.se/"

[[params.channels]]
  name = "#jonkoping"
  scope = "se-jkp"
  purpose = "Länets chattkanal"

[[params.channels]]
  name = "#test-se-jkp"
  scope = "se-jkp"
  purpose = "Testkanal: skriv `test` så svarar repeatrar med auto-svar."
  note = "Testa här, inte i chattkanalerna."

[[params.channels]]
  name = "#test-jkg"
  purpose = "Äldre testkanal"
  note = "Repeatrar med äldre firmware, och nyare utan region, svarar på `test` här. Använd `#test-se-jkp`."

[[menus.main]]
  name = "Guider"
  pageRef = "/guider"
  weight = 10

[[menus.main]]
  name = "Wizards"
  pageRef = "/wizard"
  weight = 15

[[menus.main]]
  name = "Felsökning"
  pageRef = "/felsokning"
  weight = 17
[[menus.main]]
  name = "Frågor"
  pageRef = "/fragor"
  weight = 18
[[menus.main]]
  name = "Om sidan"
  pageRef = "/om"
  weight = 20

[params.contributors]
  repos = ["sweden-mesh/meshcore-regional-template", "the-louie/meshcore-jkp"]

# Photos for the template's photo spots ({{< region-photo "key" >}}, backlog B-219). Sources in
# assets/photos/, metadata stripped; pic_1 cropped to the mast so the site is hard to place
# (operator 2026-11-14). All by the operator.
[params.photos.home]
  src = "photos/repeater-mast.jpg"
  alt = "En repeater i en vit låda med en svart antenn, på en mast bredvid en väderstation, med kvällshimmel och Vättern i bakgrunden."
  caption = "En repeater på en mast vid Vättern."
  credit = "the louie"
[params.photos.host]
  src = "photos/utsikt-vattern.jpg"
  alt = "Utsikt från en hög plats över barrskog mot Vättern."
  caption = "Högt och fritt: utsikten över skogen mot Vättern."
  credit = "the louie"
[params.photos.mount]
  src = "photos/antennfaste.jpg"
  alt = "En antenn för 868 MHz på ett grått 3D-utskrivet rörfäste, med kabeln dragen inuti röret."
  caption = "Ett väderskyddat antennfäste."
  credit = "the louie"
