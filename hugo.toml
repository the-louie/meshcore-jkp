baseURL = "https://meshcore-jkp.se/"
title = "MeshCore Jönköping"
locale = "sv"
defaultContentLanguage = "sv"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = "github.com/sweden-mesh/meshcore-regional-template"

[params.region]
  scb = "06"                 # the template takes the county name and region (se-jkp) from zombiefredrik/meshcore-se-regioner
  short = "Jönköping"
  iatas = ["JKG"]
  center = [57.78, 14.16]
  zoom = 9

[params.naming]
  pattern = "SE-JKP-Plats-ABCD"
  example = "SE-JKP-Braneryd-FD70"
  companion_example = "Jeppe"
  explain = "SE för Sverige, JKP för länet (som regionen se-jkp), platsen, och de fyra första tecknen i nodens nyckel så att namnet blir unikt."

[params.analytics]
  plausible = true
  script = "/p/s.js"
  api = "/p/event"

[params.beacon]
  url = "https://beacon.meshcore-jkp.se"
  # Our Beacon started 2026-11-12 and knows only nodes that have advertised since; meshat's
  # fills in the rest of the county until ours has heard them.
  seeds = ["https://beacon.meshat.se"]

[params.community]
  name = "JKPG-Mesh webb"
  url = "https://jkpg-mesh.se/"

[[params.chats]]
  name = "JKPG-Mesh Discord"
  url = "https://discord.gg/9FmWyw8UG7"

[[params.chats]]
  name = "Sweden Mesh Discord"
  url = "https://discord.gg/gchSzHkPGG"

[[params.links]]
  name = "meshat.se"
  url = "https://meshat.se/"

[[params.channels]]
  name = "#jonkoping"
  scope = "se-jkp"
  purpose = "Länets chattkanal"

[[params.channels]]
  name = "#test-se-jkp"
  scope = "se-jkp"
  purpose = "Testkanal: skriv `test` så svarar repeatrar med auto-svar."
  note = "Testa här, inte i chattkanalerna."

[[menus.main]]
  name = "Guider"
  pageRef = "/guider"
  weight = 10

[[menus.main]]
  name = "Verktyg"
  pageRef = "/verktyg"
  weight = 15

[[menus.main]]
  name = "Felsökning"
  pageRef = "/felsokning"
  weight = 17
[[menus.main]]
  name = "Frågor"
  pageRef = "/fragor"
  weight = 18
[[menus.main]]
  name = "Om sidan"
  pageRef = "/om"
  weight = 20
