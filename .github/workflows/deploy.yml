# Build the site with Hugo and deploy it to Cloudflare Pages (project meshcore-jkp).
#   dev  → staging: https://staging.meshcore-jkp.se (dev.meshcore-jkp.pages.dev), not indexed
#   main → production: https://meshcore-jkp.se
#   pull requests → build only, nothing deployed
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit only) and CLOUDFLARE_ACCOUNT_ID.
# MESHMAPPER_API_KEY: the region's MeshMapper key, given to Hugo as HUGO_MESHMAPPER_KEY in the
# staging and production builds (never in pull requests); without it the map has no coverage
# layer. Call budget: the key allows 100 coverage calls per UTC day and every build makes one
# (4 scheduled + each push to main or dev, typically under 30 a day). A local `hugo` with the
# variable set counts too; within the same 6-hour slot it reuses its cached download.
name: deploy
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Rebuild production every 6 hours so the build-time Beacon snapshot (the
  # map's fallback) stays fresh: 120 deploys a month. Direct Upload deploys do
  # not appear to count toward Pages' 500 builds/month (Git builds do); even if
  # they did, this stays well under it. Scheduled runs use the default branch.
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      PAGEFIND_VERSION: 1.5.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install Hugo
        run: |
          curl -sSLo hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo && sudo install hugo /usr/local/bin/hugo
          curl -sSLo pagefind.tar.gz "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf pagefind.tar.gz pagefind && sudo install pagefind /usr/local/bin/pagefind
      - name: Build (staging)
        if: github.ref != 'refs/heads/main'
        env:
          HUGO_PARAMS_NOINDEX: "true"
          HUGO_MESHMAPPER_KEY: ${{ github.event_name != 'pull_request' && secrets.MESHMAPPER_API_KEY || '' }}
        run: hugo --gc --minify --baseURL https://staging.meshcore-jkp.se/
      - name: Build (production)
        if: github.ref == 'refs/heads/main'
        env:
          HUGO_MESHMAPPER_KEY: ${{ github.event_name != 'pull_request' && secrets.MESHMAPPER_API_KEY || '' }}
        run: hugo --gc --minify
      - name: Search index
        run: pagefind --site public
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=meshcore-jkp --branch=${{ github.ref_name }} --commit-dirty=true
